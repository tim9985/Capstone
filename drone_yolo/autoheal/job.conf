# gpu_autoheal.sh 가 부팅 때 자동으로 이어갈 학습 (se 계정으로 실행)
# 값에 따옴표 · 공백을 쓰지 않는다. JOB_SCRIPT 는 레포 최상위의 .sh 파일 이름
# 학습이 끝나면(전체 epoch 또는 weights/<JOB_NAME>.pt 복사) 재개하지 않고, EVAL_CSV 가 없으면 평가만 돌린다
# 이전 작업: m2_11m_1280_sard · train_m2.sh (09-15 완료)
# 09-15 화각 비교 대기열: 부팅 뒤 train_fov_boot.sh 가 fov_guard.sh(백업 · JOB_NAME 단계 전환)를 켜고 train_fov.sh 를 이어 실행한다
# 스크립트가 끝난 단계를 스스로 건너뛴다. 평가도 스크립트가 하므로 EVAL_CSV 는 비운다 (eval_domain 자동 실행 방지)
JOB_NAME=fov_11s_1280_all
JOB_SCRIPT=train_fov_boot.sh
EVAL_CSV=
EVAL_IMGSZ=1280
